<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>记账本</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root { --text-main: #f9fafb; --text-sub: #9ca3af; --border: #1f2937; --radius-lg: 18px; --radius-md: 12px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background: radial-gradient(circle at top, #1f2937 0, #020617 45%, #000 100%); color: var(--text-main); display: flex; justify-content: center; }
    .app { width: 100%; max-width: 480px; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 4px 2px; }
    .title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .pill { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(15,23,42,0.9); border: 1px solid rgba(148,163,184,0.25); color: var(--text-sub); }
    .today { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .card { background: radial-gradient(circle at top left, #111827 0, #020617 55%); border-radius: var(--radius-lg); padding: 16px; border: 1px solid rgba(31,41,55,0.9); }
    .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
    .accounts-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .account-card { background: rgba(15,23,42,0.9); border-radius: var(--radius-md); padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; }
    .account-card.spend  { border: 1px solid rgba(248,113,113,0.5); }
    .account-card.reserve { border: 1px solid rgba(96,165,250,0.5); }
    .account-card.growth { border: 1px solid rgba(34,197,94,0.5); }
    .account-label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.06em; }
    .account-amount { font-size: 17px; font-weight: 700; min-height: 24px; }
    .account-card.spend .account-amount { color: #fb7185; }
    .account-card.reserve .account-amount { color: #60a5fa; }
    .account-card.growth .account-amount { color: #4ade80; }
    .edit-btn { font-size: 11px; color: var(--text-sub); background: transparent; border: 1px solid rgba(148,163,184,0.3); border-radius: 999px; padding: 2px 8px; cursor: pointer; align-self: flex-start; }
    .summary-row { display: flex; gap: 10px; }
    .chip { flex: 1; border-radius: 999px; background: rgba(15,23,42,0.9); padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
    .chip.-income { border: 1px solid rgba(45,212,191,0.6); }
    .chip.-expense { border: 1px solid rgba(248,113,113,0.6); }
    .chip-label { font-size: 11px; color: var(--text-sub); }
    .chip-value { font-size: 15px; font-weight: 700; }
    .chip-value.-pos { color: #4ade80; }
    .chip-value.-neg { color: #fb7185; }
    .net-value { font-size: 28px; font-weight: 700; margin: 6px 0 10px; }
    .budget-bar-bg { width: 100%; height: 8px; border-radius: 999px; background: rgba(15,23,42,1); overflow: hidden; border: 1px solid rgba(31,41,55,1); }
    .budget-bar-fill { height: 100%; border-radius: inherit; transition: width 0.4s; }
    .budget-info { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-top: 4px; }
    .month-nav { display: flex; align-items: center; gap: 6px; }
    .nav-btn { background: transparent; border: 1px solid rgba(148,163,184,0.3); border-radius: 999px; color: var(--text-sub); font-size: 16px; width: 26px; height: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .tab-group { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(17,24,39,0.85); border: 1px solid rgba(55,65,81,1); gap: 3px; }
    .tab { border-radius: 999px; padding: 4px 12px; font-size: 12px; border: none; background: transparent; color: var(--text-sub); cursor: pointer; }
    .tab.-active { background: linear-gradient(135deg,#22c55e,#4ade80); color: #022c22; font-weight: 600; }
    .form-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 10px; margin-bottom: 8px; }
    .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    label { font-size: 12px; color: var(--text-sub); }
    input[type="number"], select, input[type="text"] { width: 100%; border-radius: 999px; border: 1px solid var(--border); padding: 9px 14px; font-size: 13px; outline: none; color: var(--text-main); background: rgba(2,6,23,0.9); }
    input[type="text"] { border-radius: 12px; }
    input::placeholder { color: #4b5563; }
    input:focus, select:focus { border-color: rgba(34,197,94,0.9); }
    select { appearance: none; background-image: linear-gradient(45deg,transparent 50%,#6b7280 50%), linear-gradient(135deg,#6b7280 50%,transparent 50%); background-position: calc(100% - 14px) 12px, calc(100% - 10px) 12px; background-size: 4px 4px; background-repeat: no-repeat; background-color: rgba(2,6,23,0.9); }
    .btn-primary { width: 100%; border-radius: 999px; border: none; padding: 11px 14px; font-size: 15px; font-weight: 600; background: linear-gradient(135deg,#22c55e,#4ade80); color: #022c22; cursor: pointer; margin-top: 4px; }
    .btn-primary:active { transform: scale(0.98); }
    .txn-list { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
    .txn-list::-webkit-scrollbar { width: 4px; }
    .txn-list::-webkit-scrollbar-thumb { background: rgba(55,65,81,0.8); border-radius: 999px; }
    .txn-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; background: rgba(15,23,42,0.9); border: 1px solid rgba(31,41,55,1); border-radius: 12px; }
    .txn-left { display: flex; flex-direction: column; gap: 2px; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 10px; border: 1px solid; display: inline-block; margin-bottom: 2px; }
    .badge.-expense { border-color: rgba(248,113,113,0.8); color: #fecaca; }
    .badge.-income { border-color: rgba(45,212,191,0.8); color: #a7f3d0; }
    .txn-note { font-size: 13px; color: var(--text-main); }
    .txn-date { font-size: 11px; color: var(--text-sub); }
    .txn-amount { font-size: 14px; font-weight: 700; text-align: right; }
    .txn-amount.-expense { color: #fb7185; }
    .txn-amount.-income { color: #4ade80; }
    .empty { font-size: 13px; color: var(--text-sub); text-align: center; padding: 16px 0; }
    .footer { margin-top: 8px; font-size: 10px; text-align: center; color: #4b5563; }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div>
      <div class="title">记账本 <span class="pill">本地保存</span></div>
      <div class="today" id="todayText"></div>
    </div>
  </header>

  <section class="card">
    <div class="section-title">账户余额</div>
    <div class="accounts-grid">
      <div class="account-card spend">
        <div class="account-label">Spend</div>
        <div class="account-amount" id="amt-spend">—</div>
        <button class="edit-btn" onclick="editAccount('spend')">更新</button>
      </div>
      <div class="account-card reserve">
        <div class="account-label">Reserve</div>
        <div class="account-amount" id="amt-reserve">—</div>
        <button class="edit-btn" onclick="editAccount('reserve')">更新</button>
      </div>
      <div class="account-card growth">
        <div class="account-label">Growth</div>
        <div class="account-amount" id="amt-growth">—</div>
        <button class="edit-btn" onclick="editAccount('growth')">更新</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <span id="monthLabel"></span>
      <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
        <button class="nav-btn" onclick="changeMonth(1)">›</button>
      </div>
    </div>
    <div class="net-value" id="netValue">$0.00</div>
    <div class="summary-row">
      <div class="chip -income">
        <span class="chip-label">收入</span>
        <span class="chip-value -pos" id="incomeValue">+$0.00</span>
      </div>
      <div class="chip -expense">
        <span class="chip-label">支出</span>
        <span class="chip-value -neg" id="expenseValue">-$0.00</span>
      </div>
    </div>
    <div style="margin-top:12px;">
      <div class="budget-bar-bg"><div class="budget-bar-fill" id="budgetBar" style="width:0%"></div></div>
      <div class="budget-info">
        <span id="budgetUsed">已用 $0</span>
        <span id="budgetLeft">剩余 $3000</span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <span>记一笔</span>
      <div class="tab-group" id="typeTabs">
        <button class="tab -active" data-type="expense">支出</button>
        <button class="tab" data-type="income">收入</button>
      </div>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>金额 ($)</label>
        <input type="number" id="amountInput" step="0.01" min="0" inputmode="decimal" placeholder="58.00" />
      </div>
      <div class="form-row">
        <label>分类</label>
        <select id="categorySelect"></select>
      </div>
    </div>
    <div class="form-row">
      <label>备注（可选）</label>
      <input type="text" id="noteInput" maxlength="40" placeholder="午餐 / 地铁 / 电影票…" />
    </div>
    <button class="btn-primary" onclick="addEntry()">保存记录</button>
  </section>

  <section class="card">
    <div class="section-title">明细账单 <span id="txnCount" style="font-size:12px;color:var(--text-sub);font-weight:400;"></span></div>
    <div class="txn-list" id="txnList"></div>
  </section>

  <footer class="footer">数据仅保存在本机浏览器 · 可离线使用</footer>
</div>

<script>
(function() {
  const KEY = 'budget-app-v3';
  const BUDGET = 3000;
  const EXPENSE_CATS = ['餐饮','交通','娱乐','购物','医疗','学习','订阅','其他'];
  const INCOME_CATS = ['工资','报销','其他'];
  let state = { accounts: { spend: null, reserve: null, growth: null }, transactions: [] };
  let currentType = 'expense';
  let viewDate = new Date();

  function load() { try { const r = localStorage.getItem(KEY); if (r) state = JSON.parse(r); } catch(e) {} }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
  function fmt(n) {
    if (n === null || n === undefined) return '—';
    return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function renderHeader() {
    const d = new Date();
    const days = ['日','一','二','三','四','五','六'];
    document.getElementById('todayText').textContent =
      d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 周'+days[d.getDay()];
  }

  function renderAccounts() {
    ['spend','reserve','growth'].forEach(k => {
      document.getElementById('amt-'+k).textContent = fmt(state.accounts[k]);
    });
  }

  window.editAccount = function(key) {
    const cur = state.accounts[key];
    const label = {spend:'Spend',reserve:'Reserve',growth:'Growth'}[key];
    const val = prompt(label + ' 账户当前余额 ($)', cur !== null && cur !== undefined ? cur : '');
    if (val === null) return;
    const n = parseFloat(val.replace(/,/g,''));
    if (!isFinite(n)) { alert('请输入有效数字'); return; }
    state.accounts[key] = n;
    save();
    renderAccounts();
  };

  function getMonthTxns() {
    const key = monthKey(viewDate);
    return state.transactions.filter(t => t.date && t.date.startsWith(key));
  }

  function renderSummary() {
    const txns = getMonthTxns();
    const income = txns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const expense = txns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const net = income - expense;
    const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    document.getElementById('monthLabel').textContent = viewDate.getFullYear() + ' · ' + months[viewDate.getMonth()];
    document.getElementById('netValue').textContent = fmt(net);
    document.getElementById('incomeValue').textContent = '+' + fmt(income);
    document.getElementById('expenseValue').textContent = '-' + fmt(expense);
    const pct = Math.min(expense / BUDGET * 100, 120);
    const bar = document.getElementById('budgetBar');
    bar.style.width = pct.toFixed(1) + '%';
    bar.style.background = pct > 100 ? 'linear-gradient(90deg,#f97373,#fb923c)' : pct > 75 ? 'linear-gradient(90deg,#fbbf24,#f97316)' : 'linear-gradient(90deg,#22c55e,#4ade80)';
    document.getElementById('budgetUsed').textContent = '已用 ' + fmt(expense);
    document.getElementById('budgetLeft').textContent = expense <= BUDGET ? '剩余 ' + fmt(BUDGET - expense) : '超出 ' + fmt(expense - BUDGET);
  }

  function renderTxns() {
    const txns = getMonthTxns().slice().sort((a,b) => b.date.localeCompare(a.date));
    const list = document.getElementById('txnList');
    document.getElementById('txnCount').textContent = txns.length ? txns.length + ' 条' : '';
    if (!txns.length) { list.innerHTML = '<div class="empty">本月暂无记录</div>'; return; }
    list.innerHTML = txns.map(t => {
      const d = new Date(t.date);
      const dateStr = (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const sign = t.type === 'income' ? '+' : '-';
      return `<div class="txn-item">
        <div class="txn-left">
          <span class="badge -${t.type}">${t.type==='expense'?'支出':'收入'} · ${t.category}</span>
          <div class="txn-note">${t.note || '无备注'}</div>
          <div class="txn-date">${dateStr}</div>
        </div>
        <div class="txn-amount -${t.type}">${sign}${fmt(t.amount)}</div>
      </div>`;
    }).join('');
  }

  function renderAll() { renderAccounts(); renderSummary(); renderTxns(); }

  function populateCats() {
    const cats = currentType === 'expense' ? EXPENSE_CATS : INCOME_CATS;
    document.getElementById('categorySelect').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  window.changeMonth = function(dir) {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + dir, 1);
    renderSummary(); renderTxns();
  };

  window.addEntry = function() {
    const amt = parseFloat(document.getElementById('amountInput').value);
    if (!isFinite(amt) || amt <= 0) { alert('请输入大于0的金额'); return; }
    const cat = document.getElementById('categorySelect').value;
    const note = document.getElementById('noteInput').value.trim();
    state.transactions.push({ id: Date.now().toString(36), type: currentType, amount: amt, category: cat, note, date: new Date().toISOString() });
    save();
    document.getElementById('amountInput').value = '';
    document.getElementById('noteInput').value = '';
    viewDate = new Date();
    renderAll();
  };

  document.getElementById('typeTabs').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn || !btn.dataset.type) return;
    currentType = btn.dataset.type;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('-active', b.dataset.type === currentType));
    populateCats();
  });

  function registerPWA() {
    try {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0f172a"/><text x="256" y="340" font-family="Arial,sans-serif" font-size="300" font-weight="700" fill="#22c55e" text-anchor="middle">$</text></svg>`;
      const manifest = { name:'记账本', short_name:'记账本', start_url:'.', display:'standalone', background_color:'#0f172a', theme_color:'#0f172a', icons:[{src:'data:image/svg+xml,'+encodeURIComponent(svg),sizes:'512x512',type:'image/svg+xml'}] };
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
      document.head.appendChild(link);
    } catch(e) {}
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        try {
          const sw = "self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim());});self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});";
          navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(()=>{});
        } catch(e) {}
      });
    }
  }

  load(); renderHeader(); populateCats(); renderAll(); registerPWA();
})();
</script>
</body>
</html>
